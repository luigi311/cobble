[package]
name = "cobble-config-webview"
version = "0.8.0"
edition = "2024"
description = "Isolated webview process for Pebble app configuration pages."

[[bin]]
name = "cobble-config-webview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gtk = "0.18"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = "1"
wry = "0.57"
