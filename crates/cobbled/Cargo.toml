[package]
name = "cobbled"
version = "0.8.0"
edition = "2024"
description = "Long-lived daemon owning the Pebble BLE connection."

[[bin]]
name = "cobbled"
path = "src/main.rs"

[dependencies]
libpebble-ble = { path = "../libpebble-ble" }
cobble-contracts = { path = "../cobble-contracts" }
cobble-config = { path = "../cobble-config" }
cobble-db = { path = "../cobble-db" }
cobble-pkjs-protocol = { path = "../cobble-pkjs-protocol" }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
png = "0.18"
notify = "8"
serde_json = "1"
sha2 = "0.11"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fastrand = "2"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ashpd = { version = "0.13", default-features = false, features = ["location", "tokio"] }
tempfile = "3"
