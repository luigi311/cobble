[package]
name = "cobble-client"
version = "0.9.1"
edition = "2024"
description = "Rust D-Bus client for the cobbled Pebble BLE daemon."

[dependencies]
serde_json = "1"
cobble-contracts = { path = "../cobble-contracts" }
cobble-config = { path = "../cobble-config" }
toml = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros"] }
